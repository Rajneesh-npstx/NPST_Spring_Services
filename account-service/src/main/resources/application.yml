server:
  port: 8081

spring:
  application:
    name: account-service
  datasource:
    url: jdbc:mysql://localhost:3306/${ACCOUNT_DB:db2}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:supersecretrootpassword}
  jpa:
    hibernate:
      ddl-auto: none          # Flyway owns the schema, not Hibernate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/bank}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

springdoc:
  swagger-ui:
    path: /swagger-ui.html
 